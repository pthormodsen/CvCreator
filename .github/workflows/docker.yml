# Sjekker kjører på PR og push. Imaget bygges og publiseres til GHCR bare ved push til main.
# Samme oppsett som de andre homelab-appene (homelab-admin: k3s/README.md#images).
name: Build images

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", ".claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build # tsc -b (typesjekk) + vite build

  build:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # for å pushe til ghcr.io med GITHUB_TOKEN
    env:
      # Repoet heter CvCreator, men appen (og imaget) heter resumark
      IMAGE: ghcr.io/pthormodsen/resumark
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Taggene: latest, og full commit-SHA så en bestemt versjon kan rulles tilbake til
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            SITE_URL=https://resumark.patreek.no
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
