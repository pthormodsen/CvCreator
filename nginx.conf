# Cache-regel per sti. Filer i /assets har en hash i navnet (index-a1b2c3.js), så de kan
# caches «for alltid». Alt annet (index.html) sjekkes på nytt, så en ny versjon slår gjennom.
# Statuskoden er med, så en 404 i /assets ikke blir cachet i ett år.
map "$status $uri" $cache_control {
    "~^200 /assets/"  "public, max-age=31536000, immutable";
    default           "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Ikke vis nginx-versjonen i svar og feilsider
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Alle headere settes her og ingen andre steder: add_header i en location
    # ville skjult disse for den locationen.
    add_header Cache-Control $cache_control always;
    # Appen henter ingenting fra andre servere, så nettleseren kan nekte alt annet.
    # Et ekstra lag i tillegg til DOMPurify: et eksternt bilde blokkeres også her.
    # style-src 'unsafe-inline' trengs for CSS-variablene på arket og egen CSS fra front matter.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        # Ukjente stier gir appen (den har bare én side)
        try_files $uri /index.html;
    }

    location /assets/ {
        # En manglende fil i /assets er en ekte feil, ikke en side
        try_files $uri =404;
    }

    # Til helsesjekker i Kubernetes
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
